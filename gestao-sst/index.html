<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f4c81">
  <title>Gestão SST</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header id="topbar">
    <button type="button" id="btn-menu" class="icon-btn only-mobile" aria-label="Abrir menu">☰</button>
    <div class="brand" id="brand">
      <img id="brand-logo" alt="" hidden>
      <div>
        <strong id="brand-nome">Gestão SST</strong>
        <span class="subtitle">Gestão de Saúde e Segurança do Trabalho · funciona sem internet</span>
      </div>
    </div>
    <div class="topbar-actions">
      <span id="save-status" class="save-status" title="Situação do salvamento"></span>
      <button type="button" class="btn btn-ghost" id="btn-empresa" title="Dados da empresa e troca de empresa">Empresa</button>
      <button type="button" class="btn btn-ghost" id="btn-backup" title="Cópia de segurança">Backup</button>
    </div>
  </header>

  <div id="layout">
    <nav id="sidebar" aria-label="Módulos"></nav>
    <main id="main" tabindex="-1"></main>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h2 id="modal-title"></h2>
        <button type="button" class="icon-btn" id="modal-close" aria-label="Fechar">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-foot" id="modal-foot"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="tooltip" class="chart-tip" hidden></div>
  <div id="print-area"></div>

  <script src="js/util.js"></script>
  <script src="js/db.js"></script>
  <script src="js/config.js"></script>
  <script src="js/schema.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/modules.js"></script>
  <script src="js/dashboards.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/anexos.js"></script>
  <script src="js/xlsx-import.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
