<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auditoria de RAC – novo endereço</title>
  <meta http-equiv="refresh" content="3; url=https://nelsivansouza40-web.github.io/RAC-CAMPO/">
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: #f4f6f8; color: #1c2530; }
    main { max-width: 520px; margin: 48px auto; padding: 0 16px; }
    .card { background: #fff; border: 1px solid #d7dde3; border-radius: 10px; padding: 20px; }
    h1 { font-size: 1.2rem; color: #0a3a63; margin: 0 0 10px; }
    a.btn { display: block; text-align: center; background: #0f4c81; color: #fff; padding: 12px; border-radius: 8px; font-weight: 700; text-decoration: none; margin-top: 14px; }
    p { line-height: 1.45; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>A Auditoria de RAC mudou de endereço</h1>
      <p>O aplicativo agora tem endereço próprio, separado do Inspeções SSMA. Você será levado em instantes.</p>
      <p>No celular, instale pelo endereço novo. As auditorias já feitas continuam guardadas no aparelho.</p>
      <a class="btn" href="https://nelsivansouza40-web.github.io/RAC-CAMPO/">Abrir o novo endereço</a>
    </div>
  </main>
  <script>
    // Remove a versão antiga guardada no aparelho (service worker desta pasta).
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => regs
        .filter((r) => r.scope.endsWith('/rac-vale/'))
        .forEach((r) => r.unregister()));
    }
    setTimeout(() => location.replace('https://nelsivansouza40-web.github.io/RAC-CAMPO/'), 1500);
  </script>
</body>
</html>
