name: Publicar Inspeções SSMA no GitHub Pages

on:
  push:
    branches: [ claude/google-forms-ssma-inspection-0pjlyi ]
    paths: [ 'inspecao-ssma/**', '.github/workflows/deploy-pages.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar conteúdo do app
        uses: actions/upload-pages-artifact@v3
        with:
          path: inspecao-ssma

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
