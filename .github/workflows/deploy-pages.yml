name: Publicar Inspeções SSMA e Aprender a Ver no GitHub Pages

on:
  push:
    branches: [ claude/google-forms-ssma-inspection-0pjlyi ]
    paths: [ 'inspecao-ssma/**', 'aprender-a-ver/**', '.github/workflows/deploy-pages.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      # Inspeções SSMA continua na raiz do site (mesmo endereço de sempre);
      # Aprender a Ver fica na subpasta /aprender-a-ver/.
      - name: Montar o site
        run: |
          mkdir -p _site
          cp -r inspecao-ssma/. _site/
          cp -r aprender-a-ver _site/aprender-a-ver

      - name: Empacotar conteúdo do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
