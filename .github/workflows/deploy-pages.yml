name: Publicar Inspeções SSMA, Gestão SST e Auditoria de RAC no GitHub Pages

on:
  push:
    branches: [ claude/google-forms-ssma-inspection-0pjlyi ]
    paths: [ 'inspecao-ssma/**', 'gestao-sst/**', 'rac-vale/**', '.github/workflows/deploy-pages.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      # Inspeções SSMA continua na raiz do site (mesmo endereço de sempre);
      # Gestão SST fica na subpasta /gestao-sst/ e Auditoria de RAC em /rac-vale/.
      - name: Montar o site
        run: |
          mkdir -p _site
          cp -r inspecao-ssma/. _site/
          cp -r gestao-sst _site/gestao-sst
          cp -r rac-vale _site/rac-vale
          rm -f _site/gestao-sst/gerar-arquivo-unico.py _site/gestao-sst/.gitignore

      - name: Empacotar conteúdo do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
