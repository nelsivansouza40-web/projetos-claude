<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4a3aa7">
  <title>Gestão Ergonômica — PGR</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <strong>GESTÃO ERGONÔMICA — PGR</strong>
      <span class="subtitle">AEP · AET · Correlação · Plano de ação · NR-1/NR-17</span>
    </div>
    <div class="topbar-actions">
      <span id="conn-status" class="conn"></span>
      <button id="btn-settings" class="icon-btn" title="Configurações">⚙</button>
    </div>
  </header>

  <div id="sync-bar" hidden></div>
  <main id="view"></main>

  <script src="js/db.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/risco.js"></script>
  <script src="js/blocos-aep.js"></script>
  <script src="js/metodos-ergo.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/report.js"></script>
  <script src="js/app.js"></script>
  <script src="js/app-pgr.js"></script>
  <script src="js/app-situacao.js"></script>
  <script src="js/app-aep.js"></script>
  <script src="js/app-aet.js"></script>
  <script src="js/app-correlacao.js"></script>
  <script src="js/app-plano.js"></script>
  <script src="js/app-config.js"></script>
  <script>
    document.getElementById('btn-settings').addEventListener('click', renderConfig);

    async function init() {
      if ('serviceWorker' in navigator) {
        try { await navigator.serviceWorker.register('sw.js'); } catch (e) { console.warn(e); }
      }
      updateConnBadge();
      await updateSyncBar();
      await renderHome();
      Sync.syncAll().catch(() => {});
    }
    init();
  </script>
</body>
</html>
