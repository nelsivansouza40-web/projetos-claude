<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f4c81">
  <title>Inspeções SSMA</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <strong>FORMULÁRIO INTEGRADO DE INSPEÇÕES SSMA</strong>
      <span class="subtitle">Funciona sem internet · sincroniza automaticamente</span>
    </div>
    <div class="topbar-actions">
      <span id="conn-status" class="conn"></span>
      <button id="btn-busca-global" class="icon-btn" title="Busca global">🔍</button>
      <button id="btn-settings" class="icon-btn" title="Configurações">⚙</button>
    </div>
  </header>

  <nav id="module-nav">
    <button type="button" class="tab-btn active" id="tab-inspecoes" data-tab="inspecoes">Inspeções</button>
    <button type="button" class="tab-btn" id="tab-ptapr" data-tab="ptapr">PT/APR</button>
    <button type="button" class="tab-btn" id="tab-pet" data-tab="pet">PET</button>
    <button type="button" class="tab-btn" id="tab-dds" data-tab="dds">DDS</button>
    <button type="button" class="tab-btn" id="tab-diagnostico" data-tab="diagnostico">Diagnóstico</button>
    <button type="button" class="tab-btn" id="tab-cipa" data-tab="cipa">CIPA</button>
    <button type="button" class="tab-btn" id="tab-certificados" data-tab="certificados">Certificados</button>
    <button type="button" class="tab-btn" id="tab-investigacao" data-tab="investigacao">Investigação</button>
    <button type="button" class="tab-btn" id="tab-epi" data-tab="epi">Ficha de EPI</button>
    <button type="button" class="tab-btn" id="tab-veiculo" data-tab="veiculo">Veículos</button>
    <button type="button" class="tab-btn" id="tab-pgr" data-tab="pgr">PGR</button>
  </nav>

  <div id="sync-bar" hidden></div>

  <main id="view"></main>

  <script src="js/db.js"></script>
  <script src="js/checklists.js"></script>
  <script src="js/diagnostico-checklist.js"></script>
  <script src="js/ptapr-checklist.js"></script>
  <script src="js/certificados-tipos.js"></script>
  <script src="js/pet-checklist.js"></script>
  <script src="js/investigacao-checklist.js"></script>
  <script src="js/veiculo-checklist.js"></script>
  <script src="js/pgr-dados.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/report.js"></script>
  <script src="js/dds.js"></script>
  <script src="js/diagnostico.js"></script>
  <script src="js/cipa.js"></script>
  <script src="js/ptapr.js"></script>
  <script src="js/certificados.js"></script>
  <script src="js/pet.js"></script>
  <script src="js/investigacao.js"></script>
  <script src="js/epi.js"></script>
  <script src="js/veiculo.js"></script>
  <script src="js/pgr.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
